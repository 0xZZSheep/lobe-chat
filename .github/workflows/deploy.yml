name: Build and Deploy to Aliyun FC

on:
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  REGION_ID: cn-hongkong
  CLERK_SECRET_KEY: ${{secrets.CLERK_SECRET_KEY}}
  APP_URL: ${{secrets.APP_URL}}
  KEY_VAULTS_SECRET: ${{secrets.KEY_VAULTS_SECRET}}
  DATABASE_URL: ${{secrets.DATABASE_URL}}
  CLERK_WEBHOOK_SECRET: ${{secrets.CLERK_WEBHOOK_SECRET}}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
  NEXT_PUBLIC_SERVICE_MODE: ${{secrets.NEXT_PUBLIC_SERVICE_MODE}}
  ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET}}
  ALIBABA_CLOUD_ACCESS_KEY_ID: ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_ID}}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
          use: true
          install: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
            NEXT_PUBLIC_SERVICE_MODE=${{env.NEXT_PUBLIC_SERVICE_MODE}}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Serverless Devs
        run: |
          npm install -g @serverless-devs/s
          s --version

      - name: Configure Aliyun Credentials
        run: |
          s config add \
            --AccessKeyID ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }} \
            --AccessKeySecret ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }} \
            -a default -f

      - name: Deploy to Function Compute
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
          IMAGE_URL: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:latest
        run: |
          s deploy -y -t .github/s.yml
