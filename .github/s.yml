edition: 3.0.0
name: lobe-chat-project

vars:
  region: "ap-northeast-1"
  functionName: "lobe-chat-fc"
  image: ${env('IMAGE_URL')}

resources:
  lobe-chat-function:
    component: fc3
    access: default
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: "lobe-chat on fc"
      runtime: "custom-container"

      cpu: 1.0
      memorySize: 2048
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10

      customContainerConfig:
        image: ${vars.image}
        port: 3210

      environmentVariables:
        CLERK_SECRET_KEY: ${env('CLERK_SECRET_KEY')}
        APP_URL: ${env('APP_URL')}
        KEY_VAULTS_SECRET: ${env('KEY_VAULTS_SECRET')}
        DATABASE_URL: ${env('DATABASE_URL')}
        CLERK_WEBHOOK_SECRET: ${env('CLERK_WEBHOOK_SECRET')}
        S3_ACCESS_KEY_ID: ${env('ALIBABA_CLOUD_ACCESS_KEY_ID')}
        S3_SECRET_ACCESS_KEY: ${env('ALIBABA_CLOUD_ACCESS_KEY_SECRET')}
        S3_ENDPOINT: "https://s3.oss-cn-hongkong.aliyuncs.com"
        S3_PUBLIC_DOMAIN: "https://lobe-chat-delete.oss-cn-hongkong.aliyuncs.com"
        S3_BUCKET: "lobe-chat-delete"
        S3_REGION: "cn-hongkong"
        S3_SET_ACL: "true"

      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
