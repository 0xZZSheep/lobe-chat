edition: 3.0.0
name: lobe-chat-project

vars:
  region: "cn-hongkong"
  functionName: "lobe-chat-fc"
  image: ${env('IMAGE_URL')}

resources:
  lobe-chat-function:
    component: fc3
    access: default
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: "lobe-chat on fc"
      runtime: "custom-container"

      cpu: 1.0
      memorySize: 2048
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10

      customContainerConfig:
        image: ${vars.image}
        port: 3000

      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
